name: Ahrom full-session TSETMC collector

on:
  workflow_dispatch:
  # 08:40 Asia/Tehran = 05:10 UTC; Saturday through Wednesday (Iran workweek).
  schedule:
    - cron: '10 5 * * 0-3,6'

permissions:
  contents: read

concurrency:
  group: ahrom-tsetmc-session-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 275
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check scheduled date window (2026-11-07 to 2026-12-02 Tehran)
        id: date-window
        shell: pwsh
        run: |
          $run = 'true'
          if (${{ github.event_name == 'schedule' && 'true' || 'false' }} -eq 'true') {
            # The scheduled trigger is at 05:10 UTC (08:40 Tehran), so the UTC
            # calendar date matches the Tehran calendar date for this run.
            $today = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
            if ($today -lt '2026-11-07' -or $today -gt '2026-12-02') {
              $run = 'false'
              Write-Host "Outside temporary collection window: $today"
            }
          }
          "run=$run" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        if: steps.date-window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Ahrom session data (08:45-12:45 Tehran)
        if: steps.date-window.outputs.run == 'true'
        shell: pwsh
        run: |
          python -u tests/tsetmc_session_collector.py

      - name: Upload session data
        if: always() && steps.date-window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tsetmc-ahrom-session
          path: reports/ahrom_session_*/
          if-no-files-found: warn
          retention-days: 3
