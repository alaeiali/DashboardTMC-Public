name: TSETMC dual-source read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe TSETMC and CDN endpoints
        shell: pwsh
        run: |
          python tests/tsetmc_dual_source_test.py
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsetmc-dual-source-report
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 3
